name: Portable release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/macos-release.yml, app/**, admin/**, assets/**, scripts/build-admin.mjs, scripts/ci-release-metadata.mjs, scripts/verify-mac-release.mjs, test/update-download.test.mjs, package.json]
permissions:
  contents: read
concurrency:
  group: portable-release
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows
            command: pnpm build:win
          - runner: ubuntu-24.04
            platform: linux
            command: pnpm build:linux
          - runner: macos-15-intel
            platform: macos
            command: pnpm build:mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Install dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node scripts/download-cloudflared.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build portable apps
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: ${{ matrix.command }}
      - name: Build portable Admin tools
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node scripts/build-admin.mjs
      - name: Verify extracted Mac packages and native launch
        if: matrix.platform == 'macos'
        run: |
          node scripts/verify-mac-release.mjs
          node scripts/verify-mac-release.mjs --admin
      - name: Collect portable downloads
        run: |
          mkdir -p portable-release
          shopt -s nullglob
          files=(dist/*.exe dist/*.zip dist/*.AppImage dist/*.tar.gz dist-admin/*.exe dist-admin/*.zip dist-admin/*.AppImage)
          cp "${files[@]}" portable-release/
          for report in dist/macOS-build-*.json; do cp "$report" portable-release/; done
          for report in dist-admin/macOS-build-*.json; do cp "$report" "portable-release/admin-$(basename "$report")"; done
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}
          path: portable-release/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          merge-multiple: true
          path: release
      - name: Prepare release hashes and source
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          git archive --format=zip --output="release/SI-Remote-$VERSION-Source.zip" HEAD
          node scripts/ci-release-metadata.mjs
      - name: Publish public preview downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "ConnectForge v$VERSION — Multi-PC Workspace" --prerelease --notes-file RELEASE-NOTES.md
          gh release upload "v$VERSION" release/*
